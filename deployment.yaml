
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: demo-app-juiceshop
  name: demo-app-juiceshop-deployment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app-juiceshop
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app-juiceshop
    spec:
      containers:
      - image: bkimminich/juice-shop:latest
        imagePullPolicy: Always
        name: demo-app-juiceshop
        ports:
        - containerPort: 3000
---

apiVersion: v1
kind: Service
metadata:
  namespace: demo-app-juiceshop
  name: demo-app-juiceshop-service
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: demo-app-juiceshop
---